  - type: "content"
    anchorId: "money"
    altBackground: true
    kicker: "Ramp & reimbursements"
    heading: "Money matters"
    intro: ""
    body: |
      ### Per diem

      - **Travel days:** up to $100/day for food, on your virtual Ramp card.
      - **Onsite at CIVANA:** all meals are fully covered by CodePath — no per diem needed.

      Need a meal or snack outside of regular programming — say you land Monday and aren't part of a group dinner? Go ahead and expense it.

      <details>
      <summary>Full Ramp & reimbursement details (for reference)</summary>

      #### Lost a receipt?

      Receipts are required for every transaction and reimbursement. If yours is gone, complete the [Missing Receipt Affidavit](https://drive.google.com/file/d/12vhD2RxwG2EI6HwnuCkr7G5oMZEgpI3A/view?usp=drive_link) and submit it in Ramp instead.

      Accidentally paid with your own card? Submit a reimbursement request in Ramp — one request per charge, with a receipt attached.

      #### Coding your expenses in Ramp

      | Field | What to enter |
      | --- | --- |
      | Category | 7001 – Travel (airfare, ground transport, in-flight wifi) or 7002 – Meals |
      | Location | 999 |
      | Department | Your home cost center |
      | Project | 9006 – Org Wide Retreat 2026 |
      | Grant | 9999 |

      Full account code list [here](https://docs.google.com/spreadsheets/d/1fLRNEGghnQaxqwS3mcSpBffpXEWUJNql3SDmTILYg0Y/edit?usp=sharing).

      #### Memo field

      Be descriptive: what you purchased, and the reason for travel or the event name. [See sample memos](https://docs.google.com/document/d/1oK8f6CPwumN2U_SQkfpD7RfDrbJIO0QOrahKOclwjiw/edit?usp=sharing).

      #### Using your Ramp virtual card

      Your virtual card works like any standard card — no plastic required.

      - **View your card:** In the Ramp web app, go to Virtual Cards → your card → "Show details" for the number, expiration, and CVV.
      - **Add it to your phone:** In the Ramp mobile app, tap your card → "Add to Apple Wallet" or "Add to Google Wallet."
      - **Paying in person:** Tap to pay with your phone or watch, anywhere that takes Apple Pay/Google Pay.
      - **Paying online:** Choose the Apple Pay/Google Pay option at checkout, or turn on Chrome's autofill for Google Wallet.

      #### Completing a transaction in Ramp

      Any of these three ways works:

      - **Web or app (easiest):** Go to My Expenses → find the transaction under "Missing Items" → upload your receipt and add a memo.
      - **Email:** Forward your receipt to [receipts@ramp.com](mailto:receipts@ramp.com) from your Ramp account email, with *memo: [purpose]* in the body.
      - **Text:** Reply to Ramp's SMS prompt after a purchase with a photo of your receipt — any text you add becomes the memo.

      #### More finance resources

      - [Complete Travel & Expense Policy](https://docs.google.com/document/d/1pABYrTXoMdHjlY9We0qFKtYiHMynXmDcI92y1C3EJ9c/edit?usp=sharing)
      - [Account Codes & Memo Scripts](https://docs.google.com/document/d/1oK8f6CPwumN2U_SQkfpD7RfDrbJIO0QOrahKOclwjiw/edit?usp=sharing)
      - [Sage Intacct Coding Structure](https://docs.google.com/spreadsheets/d/1fLRNEGghnQaxqwS3mcSpBffpXEWUJNql3SDmTILYg0Y/edit?usp=sharing)
      - [Missing Receipt Affidavit](https://drive.google.com/file/d/12vhD2RxwG2EI6HwnuCkr7G5oMZEgpI3A/view?usp=drive_link)

      #### What's not reimbursable

      Travel/personal insurance, barber/salon/spa services, luggage & briefcases, personal entertainment, reading materials & subscriptions, personal vehicle repairs/insurance, traffic fines & court costs, unauthorized memberships, non-emergency personal medical costs, personal credit card interest, lost or stolen personal property, personal hygiene items, laundry before day 6 of travel, in-room movies, house or pet sitting.
      </details>

  - type: "faq"
    anchorId: "faq"
    kicker: "Everything else"
    heading: "Frequently asked questions"
    intro: "Organized by topic — click any question to expand it. This section will keep growing as more details are confirmed."
    categories:
      - icon: "✓"
        title: "RSVP & planning"
        questions:
          - q: "Do I need to RSVP?"
            a: "RSVPs closed on September 10. If you haven't submitted yours, still need to update your details, or have a change in plans, email [offsite2026@codepath.org](mailto:offsite2026@codepath.org) as soon as possible."
          - q: "What if I already have time off planned?"
            a: "Talk to your manager. We'd love to have you there, but we respect time off you've already planned and won't expect you to change it. Please flag any conflicts as early as possible so it can be worked through together."
          - q: "Who do I contact with questions?"
            a: "Email [offsite2026@codepath.org](mailto:offsite2026@codepath.org), or reach out in the dedicated Slack channel."
      - icon: "◆"
        title: "Event & venue"
        questions:
          - q: "Where exactly is the offsite?"
            a: "[CIVANA Wellness Resort & Spa](https://www.civanacarefree.com/) in Carefree, Arizona — just outside Phoenix/Scottsdale. 37220 Mule Train Road, Carefree, AZ 85377."
          - q: "What if I arrive early or have downtime — is there anything to do?"
            a: "Absolutely. CIVANA has a wide range of outdoor spaces to relax in, plus a full daily schedule of wellness classes you can sign up for anytime. Instructions for signing up will land in your inbox a few days before you arrive."
      - icon: "♥"
        title: "Family, infants & guests"
        questions:
          - q: "Can I bring family or guests?"
            a: "No — the offsite is for CodePath team members only. No additional family members or guests."
          - q: "I have a nursing infant. Can my baby come?"
            a: "We completely understand and support the needs of nursing parents."
      - icon: "✈"
        title: "International travel"
        questions:
          - q: "What documents do I need to enter the United States?"
            a: |
              It depends on your citizenship and passport:

              - Citizens of a Visa Waiver Program (VWP) country need a valid biometric e-passport and ESTA approval obtained before boarding, an intended stay of 90 days or less, and a return or onward ticket.
              - ESTA is valid for two years (or until your passport expires, whichever comes first) and covers multiple short visits — if you've traveled to the U.S. before, you may already have a valid one on file.
          - q: "How far in advance should I apply for ESTA?"
            a: "As early as possible. Processing can range from 24 hours to 3 weeks (averaging 4–5 business days), but it varies by country."
          - q: "Will CodePath reimburse ESTA application costs?"
            a: "Yes. Submit a request through Ramp with your receipt."
          - q: "What if my passport is close to expiring?"
            a: "Renew it before booking travel. Many countries, including the U.S. for many visa categories, require your passport to stay valid for a set period beyond your travel dates (commonly 6 months). If your ESTA is tied to an expiring passport, it becomes invalid too — you'd need to reapply once you have your new one."
          - q: "What should I bring with me when I travel internationally?"
            a: |
              - Your passport, valid for the required duration
              - Your ESTA approval printout, as applicable
              - Proof of onward/return travel (recommended, even if not always requested)
              - Document explaining purpose of travel — international travelers have been provided with a letter; if you have not received one, please reach out to [offsite2026@codepath.org](mailto:offsite2026@codepath.org)
          - q: "What seats can I purchase on my flight as an international traveler?"
            a: "You may upgrade to Economy Plus for extra legroom. Any additional upgrades need your manager's approval."
      - icon: "✦"
        title: "Food & dietary needs"
        questions:
          - q: "Will meals be covered?"
            a: "Yes — all meals onsite at CIVANA are fully covered by CodePath. For meals during travel, use your virtual or physical Ramp card."
          - q: "What if I have dietary restrictions or accessibility needs?"
            a: "Dietary restrictions and accessibility needs have been collected through your RSVP form. If anything has changed since submission, reach out to [offsite2026@codepath.org](mailto:offsite2026@codepath.org)."
      - icon: "☀"
        title: "Packing & what to expect"
        questions:
          - q: "What should I pack? Is there a dress code?"
            a: |
              Casual but professional — we're at a resort, so lean into that, but this is still a work event, so use your best judgment. More details (including any themed evenings) will be shared closer to the event.

              Since CIVANA offers everything from outdoor adventures and yoga to spa and fitness, pack for a range of activities:

              - Workout clothes
              - Outdoor attire
              - Lounge wear
              - Comfortable footwear (sneakers, hiking boots, sandals)
              - Swimsuit
              - Sun protection

              **Bring your work laptop.**

              **Seasonal weather:** October in Carefree runs roughly 45°F–85°F (lows to highs).
          - q: "Are checked bag fees covered?"
            a: "Yes — your first checked bag is covered using your virtual (or physical) Ramp card. A second bag is only reimbursed if you must carry a large amount of supplies for official business, and needs approval before your day of travel."
          - q: "What if I need to step out for a meeting?"
            a: "We understand that the important work of CodePath doesn't pause during the offsite. There are plenty of indoor and outdoor quiet corners to take a call — we ask that you try to minimize this to stay present, but totally understand if something needs your attention."
      - icon: "$"
        title: "Money & expenses — the fine print"
        questions:
          - q: "What are the daily per diem rates?"
            a: "Up to $100/day for food on travel days, covering breakfast, lunch, and dinner combined. Meals onsite at CIVANA are already fully covered separately."

