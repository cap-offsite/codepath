  - type: content
    heading: Expenses
    intro: ''
    anchorId: money
    altBackground: true
    kicker: Ramp & reimbursements
    body: |-
      ### Per diem

      - **Travel days:** up to $100/day for food, on your virtual or physical Ramp card.
      - **Onsite at CIVANA:** CIVANA will provide all meals during your stay.

      **Extra food and beverages onsite:** If you need a dietary accommodation or want additional food, snacks, or beverages, you can use your physical or virtual Ramp card to buy them. You can spend up to $50 per day on these extra food and beverage purchases while onsite at the resort. All purchases require a receipt in Ramp, and the memo should say "Purchased additional food/beverage during the 2026 Org Wide Retreat."

      <details>
      <summary>Full Ramp & reimbursement details (for reference)</summary>

      #### Lost a receipt?

      Receipts are required for every transaction and reimbursement. If yours is gone, complete the [Missing Receipt Affidavit](https://drive.google.com/file/d/12vhD2RxwG2EI6HwnuCkr7G5oMZEgpI3A/view?usp=drive_link) and submit it in Ramp instead.

      Accidentally paid with your own card? Submit a reimbursement request in Ramp — one request per charge, with a receipt attached.

      #### Coding your expenses in Ramp

      | Field | What to enter |
      | --- | --- |
      | Category | 7001 – Travel (airfare, ground transport, in-flight wifi) or 7002 – Meals |
      | Location | 999 |
      | Department | Your home cost center |
      | Project | 9006 – Org Wide Retreat 2026 |
      | Grant | 9999 |

      Full account code list [here](https://docs.google.com/spreadsheets/d/1fLRNEGghnQaxqwS3mcSpBffpXEWUJNql3SDmTILYg0Y/edit?usp=sharing).

      #### Memo field

      Be descriptive: what you purchased, and the reason for travel or the event name. [See sample memos](https://docs.google.com/document/d/1oK8f6CPwumN2U_SQkfpD7RfDrbJIO0QOrahKOclwjiw/edit?usp=sharing).

      #### Using your Ramp virtual card

      Your virtual card works like any standard card — no plastic required.

      - **View your card:** In the Ramp web app, go to Virtual Cards → your card → "Show details" for the number, expiration, and CVV.
      - **Add it to your phone:** In the Ramp mobile app, tap your card → "Add to Apple Wallet" or "Add to Google Wallet."
      - **Paying in person:** Tap to pay with your phone or watch, anywhere that takes Apple Pay/Google Pay.
      - **Paying online:** Choose the Apple Pay/Google Pay option at checkout, or turn on Chrome's autofill for Google Wallet.

      #### Completing a transaction in Ramp

      Any of these three ways works:

      - **Web or app (easiest):** Go to My Expenses → find the transaction under "Missing Items" → upload your receipt and add a memo.
      - **Email:** Forward your receipt to [receipts@ramp.com](mailto:receipts@ramp.com) from your Ramp account email, with _memo: [purpose]_ in the body.
      - **Text:** Reply to Ramp's SMS prompt after a purchase with a photo of your receipt — any text you add becomes the memo.

      #### More finance resources

      - [Complete Travel & Expense Policy](https://docs.google.com/document/d/1pABYrTXoMdHjlY9We0qFKtYiHMynXmDcI92y1C3EJ9c/edit?usp=sharing)
      - [Account Codes & Memo Scripts](https://docs.google.com/document/d/1oK8f6CPwumN2U_SQkfpD7RfDrbJIO0QOrahKOclwjiw/edit?usp=sharing)
      - [Sage Intacct Coding Structure](https://docs.google.com/spreadsheets/d/1fLRNEGghnQaxqwS3mcSpBffpXEWUJNql3SDmTILYg0Y/edit?usp=sharing)
      - [Missing Receipt Affidavit](https://drive.google.com/file/d/12vhD2RxwG2EI6HwnuCkr7G5oMZEgpI3A/view?usp=drive_link)

      #### What's not reimbursable

      Travel/personal insurance, barber/salon/spa services, luggage & briefcases, personal entertainment, reading materials & subscriptions, personal vehicle repairs/insurance, traffic fines & court costs, unauthorized memberships, non-emergency personal medical costs, personal credit card interest, lost or stolen personal property, personal hygiene items, laundry before day 6 of travel, in-room movies, house or pet sitting.
      </details>
