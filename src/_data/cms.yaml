  - type: "content"
    anchorId: "travel"
    kicker: "Getting there and staying"
    heading: "Flights, hotel & ground transport"
    intro: ""
    body: |
      ### Hotel

      - Has been booked for you — no action needed. CodePath handles all hotel bookings, and every team member gets their own individual room.
      - No personal card needed at check-in — all incidentals are billed to the CodePath master account. If asked, just remind the front desk of this.
      - Arriving early? The bellman can store your luggage and you can use the resort amenities before check-in — the front desk will text you when your room is ready.
      - Please don't charge extras (spa, additional food/drinks) to the room — pay directly at the front desk with your own payment method. These aren't reimbursed.

      ### Flights

      Here's how to book or change your flights:

      How you book depends on whether you already carry a Ramp card:

      - **Have a physical Ramp card?** Book through the standard [Travel & Expense policy](https://docs.google.com/document/d/1KkZApHr2x4dXZCNL87ChWDnvzg3zqvHVl7fOHWD-x1c/edit?usp=sharing).
      - **No Ramp card yet?** You'll book through a virtual card issued once your RSVP is confirmed. Make sure you're still booking in compliance with all [Travel and Expense Policy](https://docs.google.com/document/d/1KkZApHr2x4dXZCNL87ChWDnvzg3zqvHVl7fOHWD-x1c/edit?usp=sharing) guidelines.

      <details>
      <summary>Need the step-by-step Ramp walkthrough? (for reference)</summary>

      1. Log in to Ramp at [app.ramp.com/sign-in](https://app.ramp.com/sign-in).
      2. Go to **Home → My Travel**.
      3. Select **Flights → Round Trip → Myself**.
      4. In "Where from," enter the airport closest to you. In "Where to," enter **PHX — Phoenix Sky Harbor International Airport**.
      5. Enter your dates — ELT: Oct 12–15, all other staff: Oct 13–15 (unless your manager has confirmed otherwise), then click **Search**.
      6. Select your departing flight, then your returning flight.
      7. Review your details, including your loyalty rewards number and flight preferences.
      8. Under **"Spend from,"** select **"2026 Org wide Retreat."**

      Also watch the [Loom walkthrough](https://www.loom.com/share/0afe6939ebc94bd5ae41ab048299cb37) for a full demo. Office hours for booking help: Tuesday, September 15 at 4:00 PM ET, and Thursday, September 17 at 2:30 PM ET.
      </details>

      **What you can book:**

      - Economy class for all flights (Economy Plus is okay for international travelers).
      - Wifi and extra legroom seating are fine to purchase.
      - Business and first class are not typically permitted.
      - Aim for the flight that best fits your schedule at the lowest available fare.

      Need to change a booked flight? Handle cancellations directly with the airline — fees are reimbursed if the change is due to CodePath travel needs, or for a valid personal/business reason with your manager's approval.

      Questions about your flights or arrival/departure logistics? Email [offsite2026@codepath.org](mailto:offsite2026@codepath.org).

      > **Checked bags:** Your first checked bag is covered — use your virtual (or physical) Ramp card. A second bag is only reimbursed if you're carrying supplies required for official business, and it needs approval before your day of travel.

